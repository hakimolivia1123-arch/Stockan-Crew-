<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a12">
<title>Sisa Fisik</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2325d366'/%3E%3Cpath d='M18 33l9 9 19-20' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.4,.5,1);
  --a1:#7c5cff; --a2:#22d3ee; --wa:#25d366; --danger:#ff5d73;
  --r:14px;
}
[data-theme=dark]{
  color-scheme:dark;
  --bg:#070a12; --card:rgba(255,255,255,.055); --card-b:rgba(255,255,255,.09);
  --text:#eef2fb; --muted:#8b95ad; --field:rgba(255,255,255,.07); --field-b:rgba(255,255,255,.12);
  --shadow:0 6px 20px rgba(0,0,0,.28); --glass:rgba(8,11,19,.88); --sheet:#0f1524; --blob:.5;
  --badge-bg:rgba(34,211,238,.12); --badge-txt:#22d3ee;
}
[data-theme=light]{
  color-scheme:light;
  --bg:#f2f4fb; --card:rgba(255,255,255,.88); --card-b:rgba(20,30,60,.08);
  --text:#121830; --muted:#68718d; --field:rgba(20,30,60,.05); --field-b:rgba(20,30,60,.11);
  --shadow:0 6px 20px rgba(40,50,90,.08); --glass:rgba(242,244,251,.9); --sheet:#ffffff; --blob:.32;
  --badge-bg:rgba(79,70,229,.1); --badge-txt:#4f46e5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%;scroll-padding-top:120px;scroll-padding-bottom:120px}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;color:inherit}
ul{list-style:none;margin:0;padding:0}
svg.ic{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}

/* ---------- latar aurora ---------- */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--bg)}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--blob);will-change:transform}
.b1{width:60vmax;height:60vmax;left:-22vmax;top:-26vmax;background:radial-gradient(circle,var(--a1),transparent 65%);animation:drift1 22s ease-in-out infinite alternate}
.b2{width:55vmax;height:55vmax;right:-24vmax;top:14vh;background:radial-gradient(circle,var(--a2),transparent 65%);animation:drift2 27s ease-in-out infinite alternate}
.b3{width:50vmax;height:50vmax;left:8vw;bottom:-30vmax;background:radial-gradient(circle,var(--wa),transparent 65%);animation:drift3 31s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(14vmax,10vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-12vmax,12vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(10vmax,-8vmax) scale(1.2)}}
@media (max-width:600px){.aurora i{filter:blur(48px)}}

/* ---------- header ringkas ---------- */
.top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);background:var(--glass);border-bottom:1px solid var(--card-b);transition:border-color .3s,box-shadow .3s}
body.scrolled .top{box-shadow:0 8px 24px rgba(0,0,0,.18)}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 9px}
h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.03em;line-height:1.1;background:linear-gradient(90deg,var(--text) 0%,var(--a2) 50%,var(--text) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 9s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.subline{margin:2px 0 0;font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.subline .date{color:var(--a2);font-weight:700}
.count{color:var(--text);font-weight:700}
.count b{display:inline-block;color:var(--wa);font-size:14px;font-variant-numeric:tabular-nums}
.count b.bump{animation:bump .45s var(--spring)}
@keyframes bump{40%{transform:scale(1.35);color:var(--wa)}}

.tools{display:flex;align-items:center;gap:6px}
.icon{position:relative;width:38px;height:38px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--card-b);background:var(--field);transition:transform .25s var(--spring),background .2s,border-color .2s}
.icon:active{transform:scale(.88)}
@media (hover:hover){.icon:hover{border-color:var(--a2)}}
.icon .i-sun,.icon .i-moon{position:absolute;transition:transform .55s var(--spring),opacity .3s}
[data-theme=dark] .i-moon{opacity:0;transform:rotate(-90deg) scale(.5)}
[data-theme=light] .i-sun{opacity:0;transform:rotate(90deg) scale(.5)}

/* Tombol pensil atur/edit */
#btnEdit{position:relative;overflow:hidden}
#btnEdit .i-check{display:none}
body.edit #btnEdit{background:linear-gradient(135deg,var(--a1),#5b8cff);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(124,92,255,.45)}
body.edit #btnEdit .i-pencil{display:none}
body.edit #btnEdit .i-check{display:block;animation:pop .45s var(--spring)}

/* Tombol sampah kosongkan angka */
#btnClear{color:var(--muted);transition:color .2s,border-color .2s}
#btnClear:hover{color:var(--danger);border-color:rgba(255,93,115,.3)}
#btnClear:active{transform:scale(.88)}

.prog{height:3px;background:var(--field);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a1),var(--a2),var(--wa),var(--a2),var(--a1));background-size:300% 100%;animation:flow 4s linear infinite;transition:width .6s var(--ease)}
@keyframes flow{to{background-position:-300% 0}}

/* ---------- daftar kartu hemat tempat ---------- */
#list{display:flex;flex-direction:column;gap:6px;padding:10px 0 140px}
.card{
  position:relative;display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border:1px solid var(--card-b);border-radius:var(--r);
  padding:7px 11px;min-height:50px;box-shadow:var(--shadow);
  gap:8px;transition:translate .4s var(--spring),scale .25s var(--ease),box-shadow .25s,border-color .4s,opacity .25s
}
.card.enter{animation:cardIn .55s var(--ease) backwards;animation-delay:calc(var(--i,0) * 22ms)}
@keyframes cardIn{from{opacity:0;translate:0 18px;scale:.96}}
.card::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:linear-gradient(var(--wa),var(--a2));transform:scaleY(0);transition:transform .45s var(--spring)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(37,211,102,.09),transparent 65%);opacity:0;transition:opacity .5s;pointer-events:none}
.card.filled{border-color:rgba(37,211,102,.35)}
.card.filled::before{transform:scaleY(1)}
.card.filled::after{opacity:1}
.card.spot{border-color:var(--a1);box-shadow:0 0 0 3px rgba(124,92,255,.3),var(--shadow)}
.card.leaving{opacity:0;scale:.9;translate:-30px 0;pointer-events:none}
.card.dragging{z-index:15;scale:1.025;border-color:var(--a2);box-shadow:0 20px 48px rgba(0,0,0,.4),0 0 0 2px rgba(34,211,238,.3);transition:scale .25s,box-shadow .25s}
.card.dropping{z-index:15;transition:translate .35s var(--spring),scale .25s var(--ease),box-shadow .25s}
#list.no-anim .card{transition:none!important}

/* Bagian kiri kartu */
.card-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.grip{flex:none;width:0;opacity:0;overflow:hidden;display:grid;place-items:center;border-radius:8px;color:var(--muted);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transition:width .35s var(--ease),opacity .25s,margin .35s var(--ease),background .2s}
.grip:active{cursor:grabbing}
body.edit .grip{width:26px;opacity:1;margin-right:2px;background:var(--field)}

.chk{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--field);color:var(--muted);font-size:11px;font-weight:700;transition:background .35s,color .3s,transform .3s var(--spring)}
.chk svg{display:none;width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.card.filled .chk{background:linear-gradient(135deg,#2bd96b,#0fa968);color:#fff;animation:pop .45s var(--spring)}
.card.filled .chk svg{display:block}
.card.filled .chk span{display:none}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.2)}100%{transform:scale(1)}}

.name{flex:1;min-width:0;border:0;outline:0;background:transparent;font-weight:700;font-size:14.5px;padding:3px 0;border-radius:8px;text-overflow:ellipsis;white-space:nowrap;overflow:hidden;pointer-events:none;transition:background .2s,padding .2s}
body.edit .name{pointer-events:auto;background:var(--field);padding:5px 8px;white-space:normal}
.name:focus{box-shadow:0 0 0 2.5px rgba(34,211,238,.35)}

.del{flex:none;width:0;height:30px;opacity:0;overflow:hidden;display:grid;place-items:center;border-radius:9px;color:var(--danger);background:rgba(255,93,115,.12);transition:width .35s var(--ease),opacity .25s,transform .2s}
body.edit .del{width:30px;opacity:1}
.del:active{transform:scale(.85)}
.del svg{width:16px;height:16px}

/* Bagian kanan kartu (slot angka + satuan) */
.slots-wrap{display:flex;align-items:center;gap:5px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.slot{display:inline-flex;align-items:center;background:var(--field);border:1px solid var(--field-b);border-radius:11px;overflow:hidden;transition:border-color .2s,box-shadow .2s,background .2s}
.slot:focus-within{border-color:var(--a2);background:var(--card);box-shadow:0 0 0 3px rgba(34,211,238,.18)}
.val{width:56px;height:34px;border:0;outline:0;background:transparent;text-align:right;font-size:15px;font-weight:700;padding:0 4px 0 8px;font-variant-numeric:tabular-nums}
.val::placeholder{color:var(--muted);opacity:.4}

.unit-btn{
  display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 8px;
  font-size:11.5px;font-weight:700;color:var(--badge-txt);background:var(--badge-bg);
  white-space:nowrap;max-width:90px;overflow:hidden;text-overflow:ellipsis;border-left:1px solid var(--field-b);
  transition:background .2s,color .2s
}
.unit-btn:empty{display:none}
.unit-btn:hover{filter:brightness(1.15)}

.rm-slot{display:none;width:24px;height:34px;align-items:center;justify-content:center;color:var(--danger);background:rgba(255,93,115,.08);border-left:1px solid var(--field-b);font-size:14px;font-weight:800}
body.edit .slots-wrap.multi .rm-slot{display:inline-flex}

.slot-sep{font-weight:800;font-size:13px;color:var(--muted);opacity:.7}

/* Tombol + Tambah Satuan Ringkas */
.btn-add-unit{
  width:28px;height:28px;display:grid;place-items:center;border-radius:9px;border:1px dashed var(--field-b);
  color:var(--muted);background:transparent;transition:color .2s,border-color .2s,transform .25s var(--spring)
}
.btn-add-unit:active{transform:rotate(90deg) scale(.85)}
@media (hover:hover){.btn-add-unit:hover{color:var(--a2);border-color:var(--a2);transform:rotate(90deg)}}
.btn-add-unit svg{width:14px;height:14px}

.empty{display:none;text-align:center;padding:60px 20px;color:var(--muted)}
.empty.show{display:block;animation:cardIn .5s var(--ease)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}

/* ---------- dock ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:18px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 50%,transparent);pointer-events:none}
.dock .inner{position:relative;max-width:640px;margin:0 auto;height:52px;pointer-events:auto}
.dock .inner>button{position:absolute;inset:0;width:100%;border-radius:16px;overflow:hidden;font-weight:800;font-size:15px;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;transition:transform .45s var(--spring),opacity .3s,box-shadow .3s}
.dock .inner>button:active{transform:scale(.97)}
.send{color:var(--text);background:var(--card);border:1px solid var(--card-b)!important;box-shadow:var(--shadow)}
.send .bg{position:absolute;inset:0;background:linear-gradient(135deg,#2bd96b,#0fa968);opacity:0;transition:opacity .5s}
.send.ready{color:#fff;animation:glow 2.4s ease-in-out infinite}
.send.ready .bg{opacity:1}
@keyframes glow{0%,100%{box-shadow:0 8px 24px rgba(37,211,102,.3)}50%{box-shadow:0 12px 36px rgba(37,211,102,.6)}}
.lab{position:relative;display:flex;align-items:center;gap:8px}
.lab em{font-style:normal;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(127,127,127,.18)}
.send.ready .lab em{background:rgba(255,255,255,.24)}
.lab .spin{display:none;width:17px;height:17px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite}
.send.busy .spin{display:block}
.send.busy .plane{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

.addbtn{color:#fff;background:linear-gradient(135deg,var(--a1),#5b8cff);box-shadow:0 8px 24px rgba(124,92,255,.4)}
.addbtn .lab{gap:7px}
.addbtn{transform:translateY(30px) scale(.95);opacity:0;pointer-events:none}
body.edit .addbtn{transform:none;opacity:1;pointer-events:auto}
body.edit .send{transform:translateY(30px) scale(.95);opacity:0;pointer-events:none}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(2.6);opacity:0}}
.cf{position:fixed;width:8px;height:12px;border-radius:2px;z-index:90;pointer-events:none;animation:cf .95s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes cf{to{transform:translate(var(--dx),calc(var(--dy) + 140px)) rotate(var(--r));opacity:0}}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom));z-index:70;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:14px;background:var(--sheet);border:1px solid var(--card-b);box-shadow:0 14px 36px rgba(0,0,0,.35);font-size:13.5px;font-weight:600;transform:translate(-50%,20px) scale(.95);opacity:0;pointer-events:none;transition:transform .45s var(--spring),opacity .25s}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast button{font-weight:800;color:var(--a2);white-space:nowrap}

/* ---------- modal sheets (bebas kedip) ---------- */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;visibility:hidden;pointer-events:none;transition:visibility 0s linear .3s}
.modal.open{visibility:visible;pointer-events:auto;transition-delay:0s}
/* Tanpa filter blur berat pada scrim agar tidak kedap-kedip di layar HP */
.scrim{position:absolute;inset:0;background:rgba(3,6,14,.72);opacity:0;transition:opacity .3s ease-out}
.modal.open .scrim{opacity:1}
.sheet{position:relative;width:100%;max-width:480px;max-height:88dvh;overflow:auto;background:var(--sheet);border:1px solid var(--card-b);border-radius:24px 24px 0 0;padding:14px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -18px 50px rgba(0,0,0,.45);transform:translateY(40px);opacity:0;transition:transform .35s var(--ease),opacity .25s}
.modal.open .sheet{transform:none;opacity:1}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:24px;padding-bottom:18px}}
.grab{width:36px;height:4px;border-radius:4px;background:var(--field-b);margin:0 auto 12px}
.sheet h2{margin:0 0 10px;font-size:18px;font-weight:800;letter-spacing:-.02em}
.sheet p{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.45}
.field{margin-bottom:12px}
.field label{display:block;margin-bottom:6px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input[type=text],.field input[type=tel]{width:100%;padding:11px 14px;border-radius:12px;background:var(--field);border:1px solid var(--field-b);outline:0;font-size:15px;font-weight:600;transition:border-color .25s,box-shadow .25s}
.field input:focus{border-color:var(--a2);box-shadow:0 0 0 3px rgba(34,211,238,.16)}

/* Pilihan Satuan Cepat (Chips) */
.chips-label{display:block;margin:8px 0 6px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.unit-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{
  padding:6px 12px;border-radius:99px;font-size:12px;font-weight:700;
  background:var(--field);border:1px solid var(--field-b);color:var(--muted);
  transition:all .2s var(--spring)
}
.chip:active{transform:scale(.92)}
.chip.active{background:linear-gradient(135deg,var(--a1),#5b8cff);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(124,92,255,.35)}

.actions{display:flex;gap:8px;margin-top:10px}
.actions .btn{flex:1}
.btn{position:relative;overflow:hidden;padding:12px 16px;border-radius:12px;font-weight:800;font-size:14.5px;text-align:center;transition:transform .25s var(--spring)}
.btn:active{transform:scale(.96)}
.btn.primary{color:#fff;background:linear-gradient(135deg,var(--a1),#5b8cff);box-shadow:0 6px 18px rgba(124,92,255,.35)}
.btn.ghost{background:var(--field)}
.btn.danger{color:var(--danger);background:rgba(255,93,115,.14)}
.btn.block{width:100%;margin-top:10px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important}
}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

<div id="app">
  <header class="top" id="topBar">
    <div class="wrap">
      <div class="head">
        <div>
          <h1>Sisa Fisik</h1>
          <p class="subline">
            <span class="date" id="dateTxt"></span>
            <span>·</span>
            <span class="count"><b id="cDone">0</b>/<span id="cTotal">0</span> terisi</span>
          </p>
        </div>
        <div class="tools">
          <button class="icon" id="btnEdit" aria-label="Atur urutan dan nama barang" title="Atur / Edit Barang">
            <svg class="ic i-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            <svg class="ic i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
          </button>
          <button class="icon" id="btnTheme" aria-label="Ganti tema" title="Ganti Tema">
            <svg class="ic i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="ic i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/></svg>
          </button>
          <button class="icon" id="btnClear" aria-label="Kosongkan semua isi data angka" title="Kosongkan Semua Isi Data Angka">
            <svg class="ic" viewBox="0 0 24 24">
              <path d="M3 6h18"/>
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
              <line x1="10" y1="11" x2="10" y2="17"/>
              <line x1="14" y1="11" x2="14" y2="17"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
    <div class="prog" id="prog"><i id="progBar"></i></div>
  </header>

  <main class="wrap">
    <ul id="list"></ul>
    <div class="empty" id="empty"><b>Daftar masih kosong</b>Tekan tombol pensil ✏️ di atas untuk menambah barang baru.</div>
  </main>

  <div class="dock">
    <div class="inner">
      <button class="send" id="btnSend" type="button">
        <span class="bg"></span>
        <span class="lab">
          <svg class="ic plane" viewBox="0 0 24 24"><path d="M21 3L10 14M21 3l-7 18-4-7-7-4 18-7z"/></svg>
          <i class="spin"></i>
          <span id="sendTxt">Kirim ke WhatsApp</span>
          <em id="sendSub"></em>
        </span>
      </button>
      <button class="addbtn" id="btnAdd" type="button">
        <span class="lab"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Tambah barang</span>
      </button>
    </div>
  </div>

<noscript>Aplikasi ini membutuhkan JavaScript.</noscript>

<script>
(() => {
'use strict';

/* ================= util ================= */
const LS_KEY = 'sisa-fisik:v1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const ic = p => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const I = {
  grip: `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="stroke:none;fill:currentColor"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></svg>`,
  check: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
  trash: ic('<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>'),
  plus: ic('<path d="M12 5v14M5 12h14"/>')
};

/* Format Tanggal SO: SO - 10-11-2026 */
const getSoDateStr = () => {
  const d = new Date();
  const day = String(d.getDate()).padStart(2, '0');
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const year = d.getFullYear();
  return `${day}-${month}-${year}`;
};
const getSoTitle = () => `SO - ${getSoDateStr()}`;

const todayKey = () => {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};

/* ================= data bawaan ================= */
const mk = (name, ...units) => ({ id: uid(), name, slots: units.map(u => ({ v: '', u })) });
const defaults = () => [
  mk('Karage', 'pack'),
  mk('Sayap', 'pack', 'porsi'),
  mk('Ayam filet', 'porsi'),
  mk('Ayam kecil', 'pack', 'porsi'),
  mk('Ayam besar', 'pack', 'porsi'),
  mk('Ebi', 'pcs'),
  mk('Timun', ''),
  mk('Crabstik', ''),
  mk('Koslow', ''),
  mk('Selada', ''),
  mk('Saos Black paper', ''),
  mk('Saos teriyaki', ''),
  mk('Saos Asam manis', 'btl', ''),
  mk('Saos pedas', ''),
  mk('Cuka', ''),
  mk('Kwipie', 'pack', ''),
  mk('Mestro', ''),
  mk('Mentai', ''),
  mk('Wijen', ''),
  mk('Minyak', ''),
  mk('Tobiko', ''),
  mk('Ricepaper', 'lembar'),
  mk('Mika', 'pcs'),
  mk('Cup(35)', 'pcs'),
  mk('Sambal horeg', '', ''),
  mk('Nasi', 'kg', 'kg', 'kg'),
  mk('Nori', 'pack', 'lembar'),
  mk('Klip besar', 'pack', 'pcs'),
  mk('Klip sedang', 'pack', 'pcs'),
  mk('Klip kecil', 'pcs'),
  mk('Tepung wfc', 'pack')
];

function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || !Array.isArray(d.items)) return null;
    d.items = d.items.filter(i => i && typeof i === 'object').map(i => ({
      id: String(i.id || uid()),
      name: String(i.name || 'Barang'),
      slots: (Array.isArray(i.slots) && i.slots.length ? i.slots : [{ v: '', u: '' }])
        .map(s => ({ v: String((s && s.v) || ''), u: String((s && s.u) || '') }))
    }));
    return d;
  } catch (e) { return null; }
}

const state = load() || { items: defaults(), theme: null, day: null };

let saveT;
const flush = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} };
const save = () => { clearTimeout(saveT); saveT = setTimeout(flush, 200); };
addEventListener('pagehide', flush);

const isFilled = it => it.slots.some(s => s.v.trim() !== '');

/* ================= elemen ================= */
const app = $('#app'), list = $('#list'), empty = $('#empty'), topBar = $('#topBar');
const cDone = $('#cDone'), cTotal = $('#cTotal'), progBar = $('#progBar'), prog = $('#prog');
const btnSend = $('#btnSend'), sendSub = $('#sendSub'), sendTxt = $('#sendTxt');
const btnEdit = $('#btnEdit');
const dockInner = $('.dock .inner');
const toastEl = $('#toast');
const cards = new Map();
let editMode = false;

/* Target item saat popup Tambah Satuan dibuka */
let activeItemForSlot = null;

/* ================= tema ================= */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $('meta[name=theme-color]').content = t === 'dark' ? '#070a12' : '#f2f4fb';
}
applyTheme(state.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
$('#btnTheme').addEventListener('click', () => {
  state.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(state.theme); save();
});

/* ================= mode Edit / Atur via Pensil ================= */
function setMode(edit) {
  editMode = edit;
  document.body.classList.toggle('edit', edit);
  cards.forEach(el => {
    const nameInp = $('.name', el);
    if (nameInp) nameInp.readOnly = !edit;
    const grip = $('.grip', el);
    if (grip) grip.tabIndex = edit ? 0 : -1;
  });
  if (edit) {
    toast('Mode Edit aktif: geser ☰ untuk ubah urutan atau ubah nama');
  } else {
    toast('Mode Isi aktif');
  }
}
btnEdit.addEventListener('click', () => setMode(!editMode));

/* ================= navigasi keyboard enter ================= */
function onValKey(e) {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const all = [...list.querySelectorAll('.val')];
  const n = all[all.indexOf(e.target) + 1];
  if (n) { n.focus(); n.select(); n.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  else e.target.blur();
}

/* ================= render slots kartu (hemat tempat) ================= */
function buildSlots(el, item, focusIdx = -1) {
  const box = $('.slots-wrap', el);
  box.textContent = '';
  box.classList.toggle('multi', item.slots.length > 1);

  item.slots.forEach((s, i) => {
    if (i > 0) {
      const sep = document.createElement('span');
      sep.className = 'slot-sep';
      sep.textContent = '+';
      box.appendChild(sep);
    }

    const d = document.createElement('div');
    d.className = 'slot';
    d.innerHTML =
      `<input class="val" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off" placeholder="0" aria-label="Jumlah ${item.name}">` +
      `<button type="button" class="unit-btn" title="Ganti satuan: ${s.u || '-'}">${s.u || 'satuan'}</button>` +
      `<button type="button" class="rm-slot" title="Hapus satuan ini" aria-label="Hapus satuan">✕</button>`;

    const val = $('.val', d);
    const unitBtn = $('.unit-btn', d);
    const rmBtn = $('.rm-slot', d);

    val.value = s.v;
    if (!s.u) unitBtn.style.display = 'none';

    val.addEventListener('input', () => {
      s.v = val.value; state.day = todayKey();
      el.classList.toggle('filled', isFilled(item));
      updateProgress(); save();
    });
    val.addEventListener('keydown', onValKey);

    // Klik satuan untuk ganti cepat di modal
    unitBtn.addEventListener('click', () => {
      openAddSlotModal(item, (newUnit) => {
        s.u = newUnit;
        buildSlots(el, item);
        save();
      }, s.u);
    });

    rmBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (item.slots.length < 2) return;
      item.slots.splice(i, 1);
      buildSlots(el, item);
      el.classList.toggle('filled', isFilled(item));
      updateProgress(); save();
    });

    box.appendChild(d);
  });

  // Tombol + Tambah Satuan Ringkas (Muncul Popup)
  const addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'btn-add-unit';
  addBtn.setAttribute('title', 'Tambah kolom satuan untuk ' + item.name);
  addBtn.setAttribute('aria-label', 'Tambah kolom satuan');
  addBtn.innerHTML = I.plus;
  addBtn.addEventListener('click', () => {
    openAddSlotModal(item, (chosenUnit) => {
      item.slots.push({ v: '', u: chosenUnit });
      buildSlots(el, item, item.slots.length - 1);
      save();
    });
  });
  box.appendChild(addBtn);

  if (focusIdx >= 0) {
    const vals = el.querySelectorAll('.val');
    if (vals[focusIdx]) {
      setTimeout(() => {
        vals[focusIdx].focus();
        vals[focusIdx].select();
      }, 50);
    }
  }
}

/* ================= render kartu barang ================= */
function buildCard(item, idx = 0) {
  const el = document.createElement('li');
  el.className = 'card' + (isFilled(item) ? ' filled' : '');
  el.dataset.id = item.id;
  el.innerHTML =
    `<div class="card-left">` +
      `<div class="grip" role="button" tabindex="-1" aria-label="Geser urutan">${I.grip}</div>` +
      `<div class="chk" aria-hidden="true"><span>${idx + 1}</span>${I.check}</div>` +
      `<input class="name" type="text" aria-label="Nama barang" autocomplete="off" spellcheck="false">` +
      `<button class="del" type="button" aria-label="Hapus barang">${I.trash}</button>` +
    `</div>` +
    `<div class="slots-wrap"></div>`;

  const name = $('.name', el);
  name.value = item.name;
  name.readOnly = !editMode;
  name.addEventListener('input', () => { item.name = name.value; save(); });
  name.addEventListener('blur', () => { if (!name.value.trim()) { name.value = item.name = 'Barang'; save(); } });
  name.addEventListener('keydown', e => { if (e.key === 'Enter') name.blur(); });

  buildSlots(el, item);

  $('.del', el).addEventListener('click', () => removeItem(item));

  const grip = $('.grip', el);
  grip.tabIndex = editMode ? 0 : -1;
  grip.addEventListener('pointerdown', e => startDrag(e, el));
  grip.addEventListener('contextmenu', e => e.preventDefault());
  grip.addEventListener('keydown', e => {
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    e.preventDefault();
    const i = state.items.indexOf(item), j = i + (e.key === 'ArrowUp' ? -1 : 1);
    if (j < 0 || j >= state.items.length) return;
    flip(() => { state.items.splice(j, 0, state.items.splice(i, 1)[0]); orderDom(); });
    save(); grip.focus({ preventScroll: true });
  });

  return el;
}

list.addEventListener('animationend', e => {
  const t = e.target;
  if (t.classList.contains('card') && e.animationName === 'cardIn') t.classList.remove('enter');
});

function renderAll() {
  list.textContent = ''; cards.clear();
  state.items.forEach((it, i) => {
    const el = buildCard(it, i);
    el.style.setProperty('--i', Math.min(i, 16));
    el.classList.add('enter');
    cards.set(it.id, el);
    list.appendChild(el);
  });
  toggleEmpty(); updateProgress();
}

function orderDom() {
  state.items.forEach((it, i) => {
    const el = cards.get(it.id);
    if (el) {
      const idxSpan = $('.chk span', el);
      if (idxSpan) idxSpan.textContent = i + 1;
      if (list.children[i] !== el) list.insertBefore(el, list.children[i] || null);
    }
  });
}
function toggleEmpty() { empty.classList.toggle('show', state.items.length === 0); }

/* FLIP Animasi Halus */
function flip(mutator) {
  const before = new Map();
  cards.forEach((el, id) => before.set(id, el.getBoundingClientRect().top));
  mutator();
  const moved = [];
  cards.forEach((el, id) => {
    if (!before.has(id)) return;
    const d = before.get(id) - el.getBoundingClientRect().top;
    if (Math.abs(d) > 1) { el.style.transition = 'none'; el.style.translate = `0 ${d}px`; moved.push(el); }
  });
  if (!moved.length) return;
  void list.offsetHeight;
  moved.forEach(el => { el.style.transition = ''; el.style.translate = ''; });
}

/* ================= progres & tombol kirim ================= */
let lastDone = -1;
function updateProgress() {
  const total = state.items.length, done = state.items.filter(isFilled).length;
  cDone.textContent = done; cTotal.textContent = total;
  progBar.style.width = (total ? (done / total * 100) : 0) + '%';
  const ready = total > 0 && done === total;
  btnSend.classList.toggle('ready', ready);
  sendSub.textContent = ready ? 'Semua terisi' : `${done}/${total} terisi`;
  if (lastDone !== -1 && lastDone !== done) {
    cDone.classList.remove('bump'); void cDone.offsetWidth; cDone.classList.add('bump');
  }
  lastDone = done;
}

/* ================= hapus & tambah ================= */
function removeItem(item) {
  const idx = state.items.indexOf(item);
  const el = cards.get(item.id);
  if (idx < 0 || !el) return;
  el.classList.add('leaving');
  setTimeout(() => {
    flip(() => { el.remove(); cards.delete(item.id); state.items.splice(idx, 1); });
    save(); updateProgress(); toggleEmpty();
    toast(`“${item.name || 'Barang'}” dihapus`, { action: 'Urungkan', fn: () => restoreItem(item, idx) });
  }, 260);
}
function restoreItem(item, idx) {
  flip(() => {
    state.items.splice(Math.min(idx, state.items.length), 0, item);
    const el = buildCard(item, idx);
    el.classList.add('enter');
    cards.set(item.id, el);
    list.appendChild(el);
    orderDom();
  });
  save(); updateProgress(); toggleEmpty();
}

function addItem(name, unit) {
  const item = { id: uid(), name, slots: [{ v: '', u: unit }] };
  state.items.push(item);
  const el = buildCard(item, state.items.length - 1);
  el.classList.add('enter', 'spot');
  cards.set(item.id, el);
  list.appendChild(el);
  save(); updateProgress(); toggleEmpty();

  // Otomatis scroll dan fokus ke input angka agar tinggal isi angkanya
  requestAnimationFrame(() => {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const valInp = $('.val', el);
    if (valInp) {
      setTimeout(() => { valInp.focus(); valInp.select(); }, 400);
    }
  });
  setTimeout(() => el.classList.remove('spot'), 1900);
}

/* ================= geser (drag & drop) ================= */
let drag = null, settling = false;

function startDrag(e, el) {
  if (drag || settling || (e.pointerType === 'mouse' && e.button !== 0)) return;
  e.preventDefault();
  const grip = e.currentTarget;
  const els = [...list.children];
  const sy = window.scrollY;
  const rects = els.map(c => c.getBoundingClientRect());
  drag = {
    el, grip, els, from: els.indexOf(el), target: els.indexOf(el),
    tops: rects.map(r => r.top + sy), hs: rects.map(r => r.height),
    gap: parseFloat(getComputedStyle(list).rowGap) || 0,
    startY: e.clientY, startScroll: sy, clientY: e.clientY, pid: e.pointerId, raf: 0
  };
  try { grip.setPointerCapture(e.pointerId); } catch (_) {}
  el.classList.add('dragging');
  document.body.classList.add('is-dragging');
  if (navigator.vibrate) navigator.vibrate(12);
  grip.addEventListener('pointermove', onDragMove);
  grip.addEventListener('pointerup', endDrag);
  grip.addEventListener('pointercancel', endDrag);
  autoScrollLoop();
}
function onDragMove(e) { if (!drag) return; drag.clientY = e.clientY; dragUpdate(); }

function dragUpdate() {
  const d = drag, last = d.els.length - 1;
  const raw = (d.clientY - d.startY) + (window.scrollY - d.startScroll);
  const minDy = d.tops[0] - d.tops[d.from];
  const maxDy = (d.tops[last] + d.hs[last]) - (d.tops[d.from] + d.hs[d.from]);
  const dy = Math.max(minDy, Math.min(maxDy, raw));
  d.el.style.translate = `0 ${dy}px`;
  const center = d.tops[d.from] + d.hs[d.from] / 2 + dy;
  let t = d.from;
  for (let j = d.from + 1; j < d.els.length; j++) if (center > d.tops[j] + d.hs[j] / 2) t = j;
  for (let j = d.from - 1; j >= 0; j--) if (center < d.tops[j] + d.hs[j] / 2) t = j;
  if (t !== d.target) {
    d.target = t;
    const h = d.hs[d.from] + d.gap;
    d.els.forEach((c, j) => {
      if (j === d.from) return;
      let y = 0;
      if (t > d.from && j > d.from && j <= t) y = -h;
      else if (t < d.from && j >= t && j < d.from) y = h;
      c.style.translate = y ? `0 ${y}px` : '';
    });
    if (navigator.vibrate) navigator.vibrate(8);
  }
}

function autoScrollLoop() {
  if (!drag) return;
  const d = drag;
  const zoneT = topBar.getBoundingClientRect().bottom + 50;
  const zoneB = dockInner.getBoundingClientRect().top - 30;
  let v = 0;
  if (d.clientY < zoneT) v = -Math.min(18, (zoneT - d.clientY) / 4 + 2);
  else if (d.clientY > zoneB) v = Math.min(18, (d.clientY - zoneB) / 4 + 2);
  if (v) { const b = window.scrollY; window.scrollBy(0, v); if (window.scrollY !== b) dragUpdate(); }
  d.raf = requestAnimationFrame(autoScrollLoop);
}

function endDrag() {
  const d = drag;
  if (!d) return;
  drag = null; settling = true;
  cancelAnimationFrame(d.raf);
  d.grip.removeEventListener('pointermove', onDragMove);
  d.grip.removeEventListener('pointerup', endDrag);
  d.grip.removeEventListener('pointercancel', endDrag);
  try { d.grip.releasePointerCapture(d.pid); } catch (_) {}
  const { from, target } = d;
  let final = 0;
  if (target > from) final = d.tops[target] + d.hs[target] - d.hs[from] - d.tops[from];
  else if (target < from) final = d.tops[target] - d.tops[from];
  d.el.classList.remove('dragging');
  d.el.classList.add('dropping');
  d.el.style.translate = `0 ${final}px`;
  setTimeout(() => {
    list.classList.add('no-anim');
    if (target !== from) {
      state.items.splice(target, 0, state.items.splice(from, 1)[0]);
      orderDom(); save();
    }
    d.els.forEach(c => { c.style.translate = ''; c.classList.remove('dropping'); });
    void list.offsetHeight;
    list.classList.remove('no-anim');
    document.body.classList.remove('is-dragging');
    settling = false;
  }, 380);
}

/* ================= toast ================= */
let toastT;
function hideToast() { toastEl.classList.remove('show'); }
function toast(msg, opt = {}) {
  toastEl.textContent = '';
  const sp = document.createElement('span'); sp.textContent = msg; toastEl.appendChild(sp);
  if (opt.action) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = opt.action;
    b.addEventListener('click', () => { opt.fn(); hideToast(); });
    toastEl.appendChild(b);
  }
  toastEl.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(hideToast, opt.action ? 5000 : 2500);
}

/* ================= modal controller (bebas flicker) ================= */
const openStack = [];
function openModal(m, focusSel) {
  m.classList.add('open'); openStack.push(m); app.inert = true;
  if (focusSel) setTimeout(() => { const f = $(focusSel, m); if (f) { f.focus(); if (f.select) f.select(); } }, 100);
}
function closeModal(m) {
  m.classList.remove('open');
  const i = openStack.indexOf(m); if (i > -1) openStack.splice(i, 1);
  app.inert = openStack.length > 0;
}
const cancelModal = m => (m._cancel ? m._cancel() : closeModal(m));
document.addEventListener('click', e => {
  const c = e.target.closest('[data-close]');
  if (c) cancelModal(c.closest('.modal'));
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && openStack.length) cancelModal(openStack[openStack.length - 1]);
});

const mConfirm = $('#mConfirm');
function confirmBox({ title, text, ok, cancel, danger }) {
  return new Promise(res => {
    $('#cTitle').textContent = title; $('#cText').textContent = text;
    const okB = $('#cOk'), noB = $('#cNo');
    okB.textContent = ok; noB.textContent = cancel;
    okB.className = 'btn ' + (danger ? 'danger' : 'primary');
    const done = v => { okB.onclick = noB.onclick = null; mConfirm._cancel = null; closeModal(mConfirm); res(v); };
    okB.onclick = () => done(true); noB.onclick = () => done(false);
    mConfirm._cancel = () => done(false);
    openModal(mConfirm);
  });
}

/* ================= POPUP 1: TAMBAH BARANG DENGAN CHIPS SATUAN ================= */
const mAdd = $('#mAdd');
const addNameInp = $('#addName');
const addUnitInp = $('#addUnit');
const addUnitChips = $('#addUnitChips');

// Setup klik chip satuan untuk Tambah Barang
$$('.chip', addUnitChips).forEach(chip => {
  chip.addEventListener('click', () => {
    $$('.chip', addUnitChips).forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    addUnitInp.value = chip.dataset.unit || '';
  });
});
addUnitInp.addEventListener('input', () => {
  const val = addUnitInp.value.trim().toLowerCase();
  $$('.chip', addUnitChips).forEach(c => c.classList.toggle('active', c.dataset.unit === val));
});

$('#btnAdd').addEventListener('click', () => {
  addNameInp.value = '';
  addUnitInp.value = 'pack';
  $$('.chip', addUnitChips).forEach(c => c.classList.toggle('active', c.dataset.unit === 'pack'));
  openModal(mAdd, '#addName');
});

$('#addForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = addNameInp.value.trim();
  if (!name) { addNameInp.focus(); return; }
  const unit = addUnitInp.value.trim();
  closeModal(mAdd);
  addItem(name, unit);
});

/* ================= POPUP 2: TAMBAH SATUAN (MULTI-SLOT) ================= */
const mAddSlot = $('#mAddSlot');
const slotDesc = $('#slotDesc');
const slotCustomUnit = $('#slotCustomUnit');
const slotUnitChips = $('#slotUnitChips');
let onSlotConfirmedCallback = null;

// Setup klik chip satuan untuk Tambah Satuan
$$('.chip', slotUnitChips).forEach(chip => {
  chip.addEventListener('click', () => {
    $$('.chip', slotUnitChips).forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    slotCustomUnit.value = chip.dataset.unit || '';
  });
});
slotCustomUnit.addEventListener('input', () => {
  const val = slotCustomUnit.value.trim().toLowerCase();
  $$('.chip', slotUnitChips).forEach(c => c.classList.toggle('active', c.dataset.unit === val));
});

function openAddSlotModal(item, callback, currentUnit = '') {
  activeItemForSlot = item;
  onSlotConfirmedCallback = callback;
  slotDesc.textContent = `Pilih satuan untuk “${item.name}”:`;
  const defaultUnit = currentUnit || 'porsi';
  slotCustomUnit.value = defaultUnit;
  $$('.chip', slotUnitChips).forEach(c => c.classList.toggle('active', c.dataset.unit === defaultUnit));
  openModal(mAddSlot, '#slotCustomUnit');
}

$('#slotForm').addEventListener('submit', e => {
  e.preventDefault();
  const chosenUnit = slotCustomUnit.value.trim();
  closeModal(mAddSlot);
  if (onSlotConfirmedCallback) {
    onSlotConfirmedCallback(chosenUnit);
  }
});

/* ================= KOSONGKAN ISIAN DATA ANGKA (LOGO SAMPAH) ================= */
function clearValues() { state.items.forEach(it => it.slots.forEach(s => { s.v = ''; })); }
function syncDom() {
  state.items.forEach(it => {
    const el = cards.get(it.id); if (!el) return;
    el.querySelectorAll('.val').forEach((inp, i) => { inp.value = it.slots[i] ? it.slots[i].v : ''; });
    el.classList.toggle('filled', isFilled(it));
  });
  updateProgress();
}

$('#btnClear').addEventListener('click', async () => {
  if (!state.items.some(isFilled)) { toast('Semua isi angka sudah kosong'); return; }
  const ok = await confirmBox({
    title: 'Kosongkan semua isi data angka?',
    text: 'Daftar barang dan satuan tetap tersimpan utuh, hanya angka stok yang dihapus.',
    ok: 'Ya, Kosongkan', cancel: 'Batal', danger: true
  });
  if (!ok) return;
  clearValues(); syncDom(); save(); toast('Semua isi data angka berhasil dikosongkan');
});

/* ================= AUTO-CLEAR HARI BARU ================= */
function checkNewDay() {
  const t = todayKey();
  if (state.day && state.day !== t && state.items.some(isFilled)) {
    clearValues(); syncDom(); toast('Hari baru: isian angka kemarin sudah dikosongkan');
  }
  state.day = t; save();
  $('#dateTxt').textContent = getSoTitle();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); else checkNewDay(); });

/* ================= PESAN & KIRIM WHATSAPP (SO - DD-MM-YYYY) ================= */
function fmtItem(it) {
  const parts = it.slots.filter(s => s.v.trim() !== '').map(s => s.v.trim() + (s.u.trim() ? ' ' + s.u.trim() : ''));
  return (it.name.trim() || 'Barang') + ' ' + (parts.length ? parts.join(' + ') : '-');
}

function buildMessage() {
  const head = `*${getSoTitle()}*`;
  return head + '\n\n' + state.items.map(fmtItem).join('\n');
}

function burst(btn) {
  const r = btn.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const colors = ['#25d366', '#22d3ee', '#7c5cff', '#ffd166', '#ff5d73'];
  for (let i = 0; i < 26; i++) {
    const p = document.createElement('i'); p.className = 'cf';
    const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 120;
    p.style.cssText = `left:${cx}px;top:${cy}px;background:${colors[i % 5]};--dx:${Math.cos(a) * v}px;--dy:${Math.sin(a) * v - 70}px;--r:${Math.random() * 720 - 360}deg`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1000);
  }
}

function ripple(e) {
  const b = e.currentTarget, r = b.getBoundingClientRect(), d = Math.max(r.width, r.height);
  const s = document.createElement('span'); s.className = 'rip';
  s.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
  b.appendChild(s); setTimeout(() => s.remove(), 600);
}
btnSend.addEventListener('pointerdown', ripple);
$('#btnAdd').addEventListener('pointerdown', ripple);

let sending = false;
btnSend.addEventListener('click', async () => {
  if (sending) return;
  if (!state.items.length) { toast('Belum ada barang di daftar'); return; }
  const missing = state.items.filter(i => !isFilled(i));
  if (missing.length) {
    const names = missing.slice(0, 5).map(i => i.name).join(', ') + (missing.length > 5 ? ` dan ${missing.length - 5} lainnya` : '');
    const go = await confirmBox({
      title: `${missing.length} barang belum terisi`,
      text: `${names}. Barang yang kosong akan ditulis “-” di pesan.`,
      ok: 'Kirim tetap', cancel: 'Lengkapi dulu'
    });
    if (!go) {
      const el = cards.get(missing[0].id);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        const v = $('.val', el);
        setTimeout(() => v && v.focus({ preventScroll: true }), 400);
      }
      return;
    }
  } else {
    burst(btnSend);
  }

  sending = true;
  btnSend.classList.add('busy'); sendTxt.textContent = 'Membuka WhatsApp…';
  const url = `https://wa.me/?text=${encodeURIComponent(buildMessage())}`;
  flush();
  const coarse = matchMedia('(pointer: coarse)').matches;
  setTimeout(() => {
    if (coarse) location.href = url;
    else { const w = window.open(url, '_blank'); if (!w) location.href = url; }
    setTimeout(() => { sending = false; btnSend.classList.remove('busy'); sendTxt.textContent = 'Kirim ke WhatsApp'; }, 1500);
  }, coarse ? 600 : 300);
});

/* ================= inisialisasi ================= */
addEventListener('scroll', () => document.body.classList.toggle('scrolled', window.scrollY > 4), { passive: true });
renderAll();
checkNewDay();
})();
</script>
